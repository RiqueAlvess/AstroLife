{% extends 'horoscope/base.html' %}

{% block title %}Entrar - AstroLife{% endblock %}

{% block content %}
<section class="container mx-auto px-4 py-20 max-w-md">
    <div class="cosmic-card rounded-3xl p-8 md:p-12">
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">🌙</div>
            <h1 class="text-3xl md:text-4xl font-bold mb-4 glow-text">
                Bem-vindo de volta
            </h1>
            <p class="text-purple-200">
                Entre para acessar seu mapa astral
            </p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <!-- Username -->
            <div>
                <label for="username" class="block text-sm font-medium mb-2">
                    Nome de Usuário
                </label>
                <input
                    type="text"
                    name="username"
                    id="username"
                    required
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:border-purple-400 focus:outline-none transition"
                    placeholder="Digite seu usuário"
                >
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium mb-2">
                    Senha
                </label>
                <input
                    type="password"
                    name="password"
                    id="password"
                    required
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:border-purple-400 focus:outline-none transition"
                    placeholder="Digite sua senha"
                >
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full cosmic-button py-4 rounded-xl font-semibold text-lg"
            >
                Entrar
            </button>
        </form>

        <!-- Register Link -->
        <div class="text-center mt-8">
            <p class="text-purple-300">
                Não tem uma conta?
                <a href="{% url 'quiz_step1' %}" class="text-purple-400 hover:text-purple-300 font-semibold">
                    Criar conta grátis
                </a>
            </p>
        </div>
    </div>

    <!-- Motivational Text -->
    <div class="text-center mt-8">
        <p class="text-purple-300 italic">
            "As estrelas estão esperando por você..."
        </p>
    </div>
</section>
{% endblock %}
